<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Mario Quest</title>
    <link rel="stylesheet" href="letter-mario.css">
</head>
<body>
    <div class="page">
        <header class="hud">
            <div class="hud-item">Collected: <span id="collectedCount">0</span>/<span id="totalCount">29</span></div>
            <div class="hud-item">Next: <span id="nextLetter">A</span></div>
            <button id="toggleCaseBtn" type="button">Switch to UPPERCASE</button>
            <button id="restartBtn" type="button">Restart</button>
        </header>

        <main class="game-shell">
            <div class="game-viewport" id="gameViewport" aria-label="Letter Mario game area">
                <div class="world" id="world">
                    <div class="sky-decor cloud cloud-a"></div>
                    <div class="sky-decor cloud cloud-b"></div>
                    <div class="sky-decor hill hill-a"></div>
                    <div class="sky-decor hill hill-b"></div>
                    <div class="ground" id="ground"></div>
                    <div class="player" id="player" aria-label="Player"></div>
                </div>
                <div class="pickup-preview" id="pickupPreview" aria-live="polite"></div>
                <div class="hint">Move with Arrow keys or A/D. Jump with Space.</div>
                <div class="mobile-controls" id="mobileControls" aria-label="Mobile game controls">
                    <button class="control-btn" id="moveLeftBtn" type="button" aria-label="Move left">&#x2190;</button>
                    <button class="control-btn" id="jumpBtn" type="button" aria-label="Jump">&#x2191;</button>
                    <button class="control-btn" id="moveRightBtn" type="button" aria-label="Move right">&#x2192;</button>
                </div>
            </div>

            <section class="status-panel" id="statusPanel">
                <p id="statusText">Collect all Danish letters from A-Z plus Æ, Ø, Å.</p>
            </section>
        </main>
    </div>

    <audio id="audioPlayer"></audio>
    <script src="disable-right-click.js"></script>
    <script src="letter-mario.js"></script>
</body>
</html>
