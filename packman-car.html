<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Packman-bil</title>
    <link rel="stylesheet" href="packman-car.css">
</head>
<body>
    <main class="page">

        <header class="target-bar">
            <span class="target-label">Find bogstavet:</span>
            <span class="target-letter" id="targetLetter"></span>
        </header>

        <div class="play-area" id="playArea" aria-label="Spil-felt"></div>

        <div class="feedback" id="feedback" aria-live="polite"></div>

        <nav class="controls" aria-label="Retningsknapper">
            <div class="dpad">
                <button class="dpad-btn" id="btnUp"    aria-label="Op">▲</button>
                <button class="dpad-btn" id="btnLeft"  aria-label="Venstre">◀</button>
                <div class="dpad-gap"></div>
                <button class="dpad-btn" id="btnRight" aria-label="Højre">▶</button>
                <button class="dpad-btn" id="btnDown"  aria-label="Ned">▼</button>
            </div>
        </nav>

    </main>

    <audio id="audioPlayer"></audio>
    <script src="disable-right-click.js"></script>
    <script src="packman-car.js"></script>
</body>
</html>
